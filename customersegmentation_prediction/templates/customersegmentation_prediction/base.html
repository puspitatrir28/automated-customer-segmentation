<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Segmentation Dash</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <style>
        body { 
            background-color: #f0f2f5 !important; /* Abu-abu terang yang elegan */
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #2d3436;
        }

        .sidebar { 
            min-height: 100vh; 
            background: #1e2125; /* Lebih soft dibanding hitam pekat */
            box-shadow: 4px 0 10px rgba(0,0,0,0.05);
            position: fixed; /* Agar sidebar tetap saat di-scroll */
        }

        .nav-link { 
            color: rgba(255,255,255,.6); 
            padding: 12px 20px;
            border-radius: 8px;
            margin: 4px 15px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-link:hover { 
            color: white; 
            background: rgba(255,255,255,.05); 
            transform: translateX(5px);
        }

        .nav-link.active { 
            color: white !important; 
            background: #4e73df !important; /* Warna biru primary */
            box-shadow: 0 4px 12px rgba(78, 115, 223, 0.3);
        }

        .main-content {
            margin-left: 16.66667%; /* Menyesuaikan lebar col-md-2 */
            padding: 30px;
        }

        @media (max-width: 768px) {
            .sidebar { position: relative; min-height: auto; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav class="col-md-2 d-none d-md-block sidebar px-0">
                <div class="p-4 text-center">
                    <h4 class="text-white mb-0 fw-bold">
                        <i class="bi bi-person-badge-fill text-primary me-2"></i>SegmentApp
                    </h4>
                    <hr class="text-white opacity-25 mt-4">
                </div>
                
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}" href="{% url 'home' %}">
                            <i class="bi bi-house-door me-2"></i> Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'analytics' %}active{% endif %}" href="{% url 'analytics' %}">
                            <i class="bi bi-speedometer2 me-2"></i> Analytics
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'prediction_form' %}active{% endif %}" href="{% url 'prediction_form' %}">
                            <i class="bi bi-cpu me-2"></i> Prediction AI
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.resolver_match.url_name == 'customer_data' %}active{% endif %}" href="{% url 'customer_data' %}">
                            <i class="bi bi-table me-2"></i> Customer Data
                        </a>
                    </li>
                </ul>

                <div class="position-absolute bottom-0 w-100 p-3 text-center opacity-50">
                    <small class="text-white" style="font-size: 10px;">v1.0 &copy; 2026</small>
                </div>
            </nav>

            <main class="col-md-10 ms-sm-auto px-md-4 main-content">
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
